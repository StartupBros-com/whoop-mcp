# Neither package's install script is needed: the build uses the prebuilt binaries.
# pnpm 11 reads allowBuilds and fails the install on any build it was not told
# about; pnpm 10 (CI) reads ignoredBuiltDependencies. Keep the two lists equal.
allowBuilds:
  '@swc/core': false
  esbuild: false
ignoredBuiltDependencies:
  - '@swc/core'
  - esbuild
